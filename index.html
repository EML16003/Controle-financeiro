<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Controle Financeiro Familiar - Estável</title>

<style>
body{
font-family:Arial;
background:#f4f6f8;
margin:20px;
}

h1{text-align:center}

.card{
background:white;
padding:15px;
margin-bottom:20px;
border-radius:8px;
}

/* SCROLL REAL FUNCIONANDO */
.scroll-box{
max-height:250px;
overflow-y:auto;
border:1px solid #ddd;
border-radius:6px;
margin-top:10px;
}

/* TABELA */
table{
width:100%;
border-collapse:collapse;
font-size:14px;
}

th,td{
border:1px solid #ccc;
padding:6px;
}

th{
background:#e9ecef;
position:sticky;
top:0;
}

/* INPUT */
input,select{
width:100%;
padding:5px;
}

/* BOTÕES */
button{
padding:8px;
margin-top:10px;
}

/* ALERT */
.alert{
font-weight:bold;
}

.hide{
display:none;
}
</style>
</head>

<body>

<h1>Controle Financeiro Familiar</h1>

<!-- ================= RENDA ================= -->
<div class="card">
<h2>Renda Mensal</h2>

<table>
<tr><th>Pessoa</th><th>Salário</th></tr>
<tr><td>Edson</td><td><input id="salEdson" type="number"></td></tr>
<tr><td>Priscila</td><td><input id="salPriscila" type="number"></td></tr>
</table>
</div>

<!-- ================= DESPESAS ================= -->
<div class="card">
<h2>Despesas</h2>

<div class="scroll-box">
<table id="expenseTable">
<tr>
<th>Data</th><th>Pessoa</th><th>Categoria</th><th>Descrição</th><th>Valor</th>
</tr>
</table>
</div>

<button onclick="addExpense()">+ Despesa</button>
</div>

<!-- ================= GANHOS ================= -->
<div class="card">
<h2>Ganhos Extras</h2>

<div class="scroll-box">
<table id="incomeTable">
<tr>
<th>Data</th><th>Pessoa</th><th>Descrição</th><th>Valor</th>
</tr>
</table>
</div>

<button onclick="addIncome()">+ Ganho</button>
</div>

<!-- ================= RESUMO ================= -->
<div class="card">
<h2>Resumo</h2>

<p>Renda Total: <span id="incomeTotal"></span></p>
<p>Despesa Total: <span id="expenseTotal"></span></p>
<p>Saldo: <span id="balance"></span></p>

<p>Edson: <span id="edsonTotal"></span></p>
<p>Priscila: <span id="priscilaTotal"></span></p>

<p class="alert" id="alert"></p>
</div>

<!-- ================= SINCRONIZAÇÃO ================= -->
<div class="card">
<h2>Sincronização</h2>

<button onclick="exportData()">📤 Exportar (WhatsApp)</button>

<textarea id="importBox" style="width:100%;height:100px;margin-top:10px"
placeholder="Cole aqui o JSON"></textarea>

<button onclick="importData()">📥 Importar</button>

</div>

<script>

/* ================= DESPESAS ================= */
function addExpense(data={}){

let table=document.getElementById("expenseTable")

let row=table.insertRow()

row.innerHTML=`
<td><input value="${data.date||''}"></td>
<td>
<select>
<option>Edson</option>
<option>Priscila</option>
</select>
</td>
<td><input value="${data.cat||''}"></td>
<td><input value="${data.desc||''}"></td>
<td><input value="${data.val||''}"></td>
`

if(data.person){
row.querySelector("select").value=data.person
}

}

/* ================= GANHOS ================= */
function addIncome(data={}){

let table=document.getElementById("incomeTable")

let row=table.insertRow()

row.innerHTML=`
<td><input value="${data.date||''}"></td>
<td>
<select>
<option>Edson</option>
<option>Priscila</option>
</select>
</td>
<td><input value="${data.desc||''}"></td>
<td><input value="${data.val||''}"></td>
`

if(data.person){
row.querySelector("select").value=data.person
}

}

/* ================= CALCULO ================= */
function update(){

let total=0,edson=0,priscila=0,incomeExtra=0

document.querySelectorAll("#expenseTable tr").forEach((r,i)=>{
if(i==0)return
let inp=r.querySelectorAll("input")
let person=r.querySelector("select").value
let val=Number(inp[3].value)
total+=val
if(person=="Edson")edson+=val
if(person=="Priscila")priscila+=val
})

document.querySelectorAll("#incomeTable tr").forEach((r,i)=>{
if(i==0)return
let val=r.querySelectorAll("input")[3].value
incomeExtra+=Number(val)
})

let income=Number(salEdson.value)+Number(salPriscila.value)+incomeExtra
let balance=income-total

incomeTotal.innerText=income.toFixed(2)
expenseTotal.innerText=total.toFixed(2)
balance.innerText=balance.toFixed(2)

edsonTotal.innerText=edson.toFixed(2)
priscilaTotal.innerText=priscila.toFixed(2)

save()
}

/* ================= SAVE ================= */
function save(){

let data={
salEdson:salEdson.value,
salPriscila:salPriscila.value,
expenses:[],
income:[]
}

localStorage.setItem("financeSystem",JSON.stringify(data))
}

/* ================= LOAD (CORRIGIDO) ================= */
function load(){

let data=localStorage.getItem("financeSystem")
if(!data)return

data=JSON.parse(data)

salEdson.value=data.salEdson||0
salPriscila.value=data.salPriscila||0

if(data.expenses){
data.expenses.forEach(e=>addExpense(e))
}

if(data.income){
data.income.forEach(i=>addIncome(i))
}

}

/* ================= EXPORT ================= */
function exportData(){
navigator.clipboard.writeText(localStorage.getItem("financeSystem"))
alert("Copiado para WhatsApp")
}

/* ================= IMPORT ================= */
function importData(){
let txt=document.getElementById("importBox").value
localStorage.setItem("financeSystem",txt)
location.reload()
}

/* ================= INIT ================= */
document.addEventListener("input",update)

load()

if(document.querySelectorAll("#expenseTable tr").length==1){
addExpense()
}

update()

</script>

</body>
</html>
