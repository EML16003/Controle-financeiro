<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro Familiar</title>

<style>

/* ===== BASE ===== */
body{
font-family:Arial;
background:#eef2f7;
margin:20px;
}

h1{
text-align:center;
margin-bottom:20px;
}

/* ===== CARD ===== */
.card{
background:white;
padding:15px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

/* ===== SCROLL FIX (NOVO) ===== */
.scroll-box{
max-height:260px;      /* ALTURA FIXA */
overflow-y:auto;       /* SCROLL VERTICAL */
border:1px solid #ddd;
border-radius:8px;
margin-top:10px;
}

/* ===== TABLE ===== */
table{
width:100%;
border-collapse:collapse;
font-size:14px;
}

th,td{
border:1px solid #ddd;
padding:6px;
}

th{
background:#f1f3f5;
position:sticky;
top:0;
z-index:1;
}

/* ===== INPUT ===== */
input,select{
width:100%;
padding:5px;
border-radius:5px;
border:1px solid #ccc;
}

/* ===== RESUMO ===== */
.summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.box{
padding:10px;
border-radius:8px;
color:white;
}

.income{background:#198754;}
.expense{background:#dc3545;}
.balance{background:#0d6efd;}

.alert{
margin-top:10px;
font-weight:bold;
}

/* ===== BOTÕES ===== */
button{
padding:8px;
margin-top:10px;
border:none;
border-radius:6px;
background:#2d6cdf;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<h1>Controle Financeiro Familiar</h1>

<!-- ================= RENDA ================= -->
<div class="card">
<h2>Renda Mensal</h2>

<table>
<tr><th>Pessoa</th><th>Salário</th></tr>
<tr><td>Edson</td><td><input id="salEdson" type="number"></td></tr>
<tr><td>Priscila</td><td><input id="salPriscila" type="number"></td></tr>
</table>
</div>

<!-- ================= DESPESAS (COM SCROLL) ================= -->
<div class="card">
<h2>Despesas</h2>

<div class="scroll-box">
<table id="expenseTable">
<tr>
<th>Data</th>
<th>Pessoa</th>
<th>Categoria</th>
<th>Descrição</th>
<th>Valor</th>
</tr>
</table>
</div>

<button onclick="addExpense()">+ Despesa</button>
</div>

<!-- ================= GANHOS (COM SCROLL) ================= -->
<div class="card">
<h2>Ganhos Extras</h2>

<div class="scroll-box">
<table id="incomeTable">
<tr>
<th>Data</th>
<th>Pessoa</th>
<th>Descrição</th>
<th>Valor</th>
</tr>
</table>
</div>

<button onclick="addIncome()">+ Ganho</button>
</div>

<!-- ================= RESUMO ================= -->
<div class="card">
<h2>Resumo Financeiro</h2>

<div class="summary">
<div class="box income" id="incomeTotal"></div>
<div class="box expense" id="expenseTotal"></div>
<div class="box balance" id="balance"></div>
</div>

<p>Edson: <span id="edsonTotal"></span></p>
<p>Priscila: <span id="priscilaTotal"></span></p>

<p class="alert" id="alert"></p>

</div>

<script>

/* ===== DESPESA ===== */
function addExpense(d={}){

let t=document.getElementById("expenseTable")
let r=t.insertRow()

r.innerHTML=`
<td><input value="${d.date||''}"></td>
<td>
<select>
<option>Edson</option>
<option>Priscila</option>
</select>
</td>
<td><input value="${d.cat||''}"></td>
<td><input value="${d.desc||''}"></td>
<td><input value="${d.val||''}"></td>
`

if(d.person) r.querySelector("select").value=d.person
}

/* ===== GANHO ===== */
function addIncome(d={}){

let t=document.getElementById("incomeTable")
let r=t.insertRow()

r.innerHTML=`
<td><input value="${d.date||''}"></td>
<td>
<select>
<option>Edson</option>
<option>Priscila</option>
</select>
</td>
<td><input value="${d.desc||''}"></td>
<td><input value="${d.val||''}"></td>
`

if(d.person) r.querySelector("select").value=d.person
}

/* ===== UPDATE ===== */
function update(){

let exp=0,ed=0,pr=0,inc=0

document.querySelectorAll("#expenseTable tr").forEach((r,i)=>{
if(i==0)return
let v=Number(r.querySelectorAll("input")[3].value)
let p=r.querySelector("select").value
exp+=v
if(p=="Edson")ed+=v
if(p=="Priscila")pr+=v
})

document.querySelectorAll("#incomeTable tr").forEach((r,i)=>{
if(i==0)return
inc+=Number(r.querySelectorAll("input")[3].value)
})

let income=Number(salEdson.value)+Number(salPriscila.value)+inc
let balance=income-exp

incomeTotal.innerText=income.toFixed(2)
expenseTotal.innerText=exp.toFixed(2)
balance.innerText=balance.toFixed(2)

edsonTotal.innerText=ed.toFixed(2)
priscilaTotal.innerText=pr.toFixed(2)

save()
}

/* ===== SAVE ===== */
function save(){
let data={
salEdson:salEdson.value,
salPriscila:salPriscila.value,
expenses:[],
income:[]
}
localStorage.setItem("financeSystem",JSON.stringify(data))
}

/* ===== LOAD ===== */
function load(){
let d=localStorage.getItem("financeSystem")
if(!d)return

d=JSON.parse(d)

salEdson.value=d.salEdson||0
salPriscila.value=d.salPriscila||0

if(d.expenses)d.expenses.forEach(e=>addExpense(e))
if(d.income)d.income.forEach(i=>addIncome(i))
}

/* ===== INIT ===== */
document.addEventListener("input",update)

load()
addExpense()
addIncome()
update()

</script>

</body>
</html>
