<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro Familiar - Refatorado</title>

<style>
body{
font-family:Arial;
background:#f4f6f8;
margin:20px;
}

h1{text-align:center}

/* CARD */
.card{
background:#fff;
padding:15px;
margin-bottom:20px;
border-radius:8px;
}

/* SCROLL TABLE AREA */
.scroll{
max-height:240px;
overflow-y:auto;
border:1px solid #ddd;
border-radius:6px;
margin-top:10px;
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
font-size:14px;
}

th,td{
border:1px solid #ccc;
padding:6px;
}

th{
background:#e9ecef;
position:sticky;
top:0;
}

/* INPUTS */
input,select{
width:100%;
padding:5px;
}

/* BUTTONS */
button{
padding:8px;
margin-top:10px;
cursor:pointer;
}

/* ALERT */
.alert{
font-weight:bold;
margin-top:10px;
}

/* HIDE */
.hide{display:none;}
</style>
</head>

<body>

<h1>Controle Financeiro Familiar</h1>

<!-- ================= RENDA ================= -->
<div class="card">
<h2>Renda Mensal</h2>

<table>
<tr><th>Pessoa</th><th>Salário</th></tr>
<tr><td>Edson</td><td><input id="salEdson" type="number"></td></tr>
<tr><td>Priscila</td><td><input id="salPriscila" type="number"></td></tr>
</table>
</div>

<!-- ================= DESPESAS ================= -->
<div class="card">
<h2>Despesas</h2>

<div class="scroll">
<table id="expenseTable">
<tr>
<th>Data</th><th>Pessoa</th><th>Categoria</th><th>Descrição</th><th>Valor</th>
</tr>
</table>
</div>

<button onclick="addExpense()">+ Despesa</button>
</div>

<!-- ================= GANHOS ================= -->
<div class="card">
<h2>Ganhos Extras</h2>

<div class="scroll">
<table id="incomeTable">
<tr>
<th>Data</th><th>Pessoa</th><th>Descrição</th><th>Valor</th>
</tr>
</table>
</div>

<button onclick="addIncome()">+ Ganho</button>
</div>

<!-- ================= RESUMO ================= -->
<div class="card">
<h2>Resumo Financeiro</h2>

<p>Renda: <span id="incomeTotal"></span></p>
<p>Despesas: <span id="expenseTotal"></span></p>
<p>Saldo: <span id="balance"></span></p>

<p>Edson: <span id="edsonTotal"></span></p>
<p>Priscila: <span id="priscilaTotal"></span></p>

<p class="alert" id="alert"></p>
</div>

<!-- ================= SYNC ================= -->
<div class="card">
<h2>Sincronização</h2>

<button onclick="exportData()">📤 Exportar</button>

<textarea id="importBox" style="width:100%;height:100px;margin-top:10px"
placeholder="Cole aqui o JSON"></textarea>

<button onclick="importData()">📥 Importar</button>

</div>

<script>

/* ================= ADD EXPENSE ================= */
function addExpense(d={}){

let t=document.getElementById("expenseTable")

let r=t.insertRow()

r.innerHTML=`
<td><input value="${d.date||''}"></td>
<td><select><option>Edson</option><option>Priscila</option></select></td>
<td><input value="${d.cat||''}"></td>
<td><input value="${d.desc||''}"></td>
<td><input value="${d.val||''}"></td>
`

if(d.person) r.querySelector("select").value=d.person
}

/* ================= ADD INCOME ================= */
function addIncome(d={}){

let t=document.getElementById("incomeTable")

let r=t.insertRow()

r.innerHTML=`
<td><input value="${d.date||''}"></td>
<td><select><option>Edson</option><option>Priscila</option></select></td>
<td><input value="${d.desc||''}"></td>
<td><input value="${d.val||''}"></td>
`

if(d.person) r.querySelector("select").value=d.person
}

/* ================= UPDATE ================= */
function update(){

let exp=0,ed=0,pr=0,incomeExtra=0

document.querySelectorAll("#expenseTable tr").forEach((r,i)=>{
if(i==0)return
let i2=r.querySelectorAll("input")
let p=r.querySelector("select").value
let v=Number(i2[3].value)

exp+=v
if(p=="Edson")ed+=v
if(p=="Priscila")pr+=v
})

document.querySelectorAll("#incomeTable tr").forEach((r,i)=>{
if(i==0)return
incomeExtra+=Number(r.querySelectorAll("input")[3].value)
})

let income=Number(salEdson.value)+Number(salPriscila.value)+incomeExtra
let balance=income-exp

incomeTotal.innerText=income.toFixed(2)
expenseTotal.innerText=exp.toFixed(2)
balance.innerText=balance.toFixed(2)

edsonTotal.innerText=ed.toFixed(2)
priscilaTotal.innerText=pr.toFixed(2)

save()
}

/* ================= SAVE ================= */
function save(){

let data={
salEdson:salEdson.value,
salPriscila:salPriscila.value,
expenses:[],
income:[]
}

localStorage.setItem("financeSystem",JSON.stringify(data))
}

/* ================= LOAD ================= */
function load(){

let d=localStorage.getItem("financeSystem")
if(!d)return

d=JSON.parse(d)

salEdson.value=d.salEdson||0
salPriscila.value=d.salPriscila||0

if(d.expenses)d.expenses.forEach(e=>addExpense(e))
if(d.income)d.income.forEach(i=>addIncome(i))
}

/* ================= EXPORT ================= */
function exportData(){
navigator.clipboard.writeText(localStorage.getItem("financeSystem"))
alert("Copiado!")
}

/* ================= IMPORT ================= */
function importData(){
localStorage.setItem("financeSystem",importBox.value)
location.reload()
}

/* ================= INIT ================= */
document.addEventListener("input",update)

load()
addExpense()
addIncome()
update()

</script>

</body>
</html>
