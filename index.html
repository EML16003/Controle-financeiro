<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Controle Financeiro Familiar</title>

<style>
body{font-family:Arial;background:#f4f6f8;margin:20px}
h1{margin-bottom:5px}

.card{background:white;padding:15px;margin-bottom:20px;border-radius:8px}

table{border-collapse:collapse;width:100%}
th,td{border:1px solid #ccc;padding:8px;text-align:left}
th{background:#e9ecef}

input,select{width:100%;padding:5px;border:1px solid #ccc}

button{padding:10px;margin-top:10px;cursor:pointer}

.alert{font-weight:bold}

/* SCROLL SÓ NA TABELA */
.scroll-box{
max-height:260px;
overflow-y:auto;
border:1px solid #ddd;
}

/* esconder */
.hide{display:none}
</style>
</head>

<body>

<h1>Controle Financeiro Familiar</h1>
<p>Sistema offline – salva automaticamente no navegador.</p>

<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center">
<h2>Renda Mensal</h2>
<button onclick="toggle('renda','btnRenda')" id="btnRenda">Ocultar</button>
</div>

<div id="renda">
<table>
<tr><th>Pessoa</th><th>Salário</th></tr>
<tr><td>Edson</td><td><input id="salEdson" type="number" value="3922.48"></td></tr>
<tr><td>Priscila</td><td><input id="salPriscila" type="number" value="2141.64"></td></tr>
</table>
</div>

</div>

<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center">
<h2>Registrar Despesa</h2>
<button onclick="toggle('despesas','btnDesp')" id="btnDesp">Ocultar</button>
</div>

<div id="despesas" class="scroll-box">

<table id="expenseTable">
<tr>
<th>Data</th>
<th>Pessoa</th>
<th>Categoria</th>
<th>Descrição</th>
<th>Valor</th>
</tr>
</table>

</div>

<button onclick="addRow()">Adicionar Despesa</button>

</div>

<div class="card">

<h2>Filtro</h2>
<input type="month" id="monthFilter">

</div>

<div class="card">

<h2>Resumo</h2>

<p>Renda Total: <span id="incomeTotal"></span></p>
<p>Despesa Total: <span id="expenseTotal"></span></p>
<p>Saldo Restante: <span id="balance"></span></p>

<p>Despesas Edson: <span id="edsonTotal"></span></p>
<p>Despesas Priscila: <span id="priscilaTotal"></span></p>

<p class="alert" id="alert"></p>

</div>

<script>

/* TOGGLE COM TEXTO DINÂMICO */
function toggle(id,btnId){
let el=document.getElementById(id)
let btn=document.getElementById(btnId)

el.classList.toggle("hide")

if(el.classList.contains("hide")){
btn.innerText="Exibir"
}else{
btn.innerText="Ocultar"
}
}

/* DESPESA */
function addRow(data={}){

let table=document.getElementById("expenseTable")
let row=table.insertRow()

row.innerHTML=`
<td><input type="date" value="${data.date||''}"></td>
<td>
<select>
<option>Edson</option>
<option>Priscila</option>
</select>
</td>
<td><input value="${data.cat||''}"></td>
<td><input value="${data.desc||''}"></td>
<td><input type="number" value="${data.val||''}"></td>
`

if(data.person){
row.querySelector("select").value=data.person
}

}

/* RENDA */
function getIncome(){
let edson=Number(document.getElementById("salEdson").value)
let priscila=Number(document.getElementById("salPriscila").value)
return edson+priscila
}

/* UPDATE (SEM MUDANÇA) */
function update(){

let month=document.getElementById("monthFilter").value

let total=0
let edsonTotal=0
let priscilaTotal=0

document.querySelectorAll("#expenseTable tr").forEach((row,i)=>{

if(i==0)return

let inputs=row.querySelectorAll("input")
let person=row.querySelector("select").value

let date=inputs[0].value
let val=Number(inputs[3].value)

if(!date)return
if(month && !date.startsWith(month)) return

total+=val

if(person=="Edson") edsonTotal+=val
if(person=="Priscila") priscilaTotal+=val

})

let income=getIncome()
let balance=income-total

document.getElementById("incomeTotal").innerText=income.toFixed(2)
document.getElementById("expenseTotal").innerText=total.toFixed(2)
document.getElementById("balance").innerText=balance.toFixed(2)

document.getElementById("edsonTotal").innerText=edsonTotal.toFixed(2)
document.getElementById("priscilaTotal").innerText=priscilaTotal.toFixed(2)

let alert=""
if(total>income*0.7){
alert="⚠ Atenção: despesas acima de 70% da renda"
}
else if(balance>2000){
alert="✅ Ótimo! Vocês estão economizando bem."
}
else{
alert="ℹ Situação financeira estável."
}

document.getElementById("alert").innerText=alert

save()
}

/* SAVE ORIGINAL */
function save(){

let data={
salEdson:document.getElementById("salEdson").value,
salPriscila:document.getElementById("salPriscila").value,
expenses:[]
}

document.querySelectorAll("#expenseTable tr").forEach((row,i)=>{

if(i==0)return

let inputs=row.querySelectorAll("input")
let person=row.querySelector("select").value

data.expenses.push({
date:inputs[0].value,
person:person,
cat:inputs[1].value,
desc:inputs[2].value,
val:inputs[3].value
})

})

localStorage.setItem("financeSystem",JSON.stringify(data))

}

/* LOAD ORIGINAL */
function load(){

let data=localStorage.getItem("financeSystem")

if(!data) return

data=JSON.parse(data)

document.getElementById("salEdson").value=data.salEdson
document.getElementById("salPriscila").value=data.salPriscila

data.expenses.forEach(e=>addRow(e))

}

document.addEventListener("input",update)
document.getElementById("monthFilter").addEventListener("change",update)

load()

if(document.querySelectorAll("#expenseTable tr").length==1){
addRow()
}

update()

</script>

</body>
</html>
