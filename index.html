<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro Familiar</title>

<style>
body{
font-family:Arial;
background:#eef2f7;
margin:10px;
}

h1{text-align:center;margin-bottom:5px}

.card{
background:white;
padding:12px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.header-bar{
display:flex;
justify-content:space-between;
align-items:center;
}

button{
padding:8px;
margin-top:8px;
border:none;
border-radius:6px;
background:#2d6cdf;
color:white;
cursor:pointer;
}

button.small{
padding:4px 6px;
font-size:12px;
background:#6c757d;
}

button.delete{
background:#dc3545;
padding:4px 6px;
font-size:12px;
}

table{
width:100%;
border-collapse:collapse;
font-size:14px;
}

th,td{
border:1px solid #ddd;
padding:6px;
}

th{background:#f1f3f5}

input,select{
width:100%;
padding:5px;
border:1px solid #ccc;
border-radius:5px;
}

/* SCROLL */
.scroll-box{
max-height:260px;
overflow-y:auto;
border:1px solid #ddd;
border-radius:8px;
}

.summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.box{
padding:10px;
border-radius:10px;
color:white;
white-space:pre-line;
}

.income{background:#198754}
.expense{background:#dc3545}
.balance{background:#0d6efd}

.alert{font-weight:bold;margin-top:10px}

.hide{display:none}
</style>
</head>

<body>

<h1>Controle Financeiro Familiar</h1>

<!-- RENDA -->
<div class="card">
<div class="header-bar">
<h2>Renda Mensal</h2>
<button class="small" onclick="toggle('incomeBox')">Ocultar</button>
</div>

<div id="incomeBox">
<table>
<tr><th>Pessoa</th><th>Salário</th></tr>
<tr><td>Edson</td><td><input id="salEdson" type="number"></td></tr>
<tr><td>Priscila</td><td><input id="salPriscila" type="number"></td></tr>
</table>
</div>
</div>

<!-- DESPESAS -->
<div class="card">
<div class="header-bar">
<h2>Despesas</h2>
<button class="small" onclick="toggle('expenseBox')">Ocultar</button>
</div>

<div id="expenseBox">
<div class="scroll-box">
<table id="expenseTable">
<tr>
<th>Data</th>
<th>Pessoa</th>
<th>Categoria</th>
<th>Descrição</th>
<th>Valor</th>
<th>Ação</th>
</tr>
</table>
</div>
<button onclick="addExpense()">+ Despesa</button>
</div>
</div>

<!-- GANHOS -->
<div class="card">
<div class="header-bar">
<h2>Ganhos Extras</h2>
<button class="small" onclick="toggle('incomeBoxExtra')">Ocultar</button>
</div>

<div id="incomeBoxExtra">
<div class="scroll-box">
<table id="incomeTable">
<tr>
<th>Data</th>
<th>Pessoa</th>
<th>Descrição</th>
<th>Valor</th>
<th>Ação</th>
</tr>
</table>
</div>
<button onclick="addIncome()">+ Ganho</button>
</div>
</div>

<!-- FILTRO -->
<div class="card">
<h2>Filtro</h2>
<input type="month" id="monthFilter">
</div>

<!-- RESUMO -->
<div class="card">
<h2>Resumo</h2>

<div class="summary">
<div class="box income" id="incomeTotal"></div>
<div class="box expense" id="expenseTotal"></div>
<div class="box balance" id="balance"></div>
</div>

<p>Edson: <span id="edsonTotal"></span></p>
<p>Priscila: <span id="priscilaTotal"></span></p>

<p class="alert" id="alert"></p>
</div>

<script>

function toggle(id){
document.getElementById(id).classList.toggle("hide")
}

/* DESPESA */
function addExpense(d={}){
let t=document.getElementById("expenseTable")
let r=t.insertRow()
r.innerHTML=`
<td><input type="date" value="${d.date||""}"></td>
<td>
<select>
<option>Edson</option>
<option>Priscila</option>
</select>
</td>
<td><input value="${d.cat||""}"></td>
<td><input value="${d.desc||""}"></td>
<td><input type="number" value="${d.val||""}"></td>
<td><button class="delete" onclick="this.parentElement.parentElement.remove();update();save()">X</button></td>
`
if(d.person) r.querySelector("select").value=d.person
}

/* GANHO */
function addIncome(d={}){
let t=document.getElementById("incomeTable")
let r=t.insertRow()
r.innerHTML=`
<td><input type="date"></td>
<td>
<select><option>Edson</option><option>Priscila</option></select>
</td>
<td><input value="${d.desc||""}"></td>
<td><input type="number" value="${d.val||""}"></td>
<td><button class="delete" onclick="this.parentElement.parentElement.remove();update();save()">X</button></td>
`
if(d.person) r.querySelector("select").value=d.person
}

/* RENDA */
function getIncome(){
let e=Number(salEdson.value||0)
let p=Number(salPriscila.value||0)
let extra=0

document.querySelectorAll("#incomeTable tr").forEach((r,i)=>{
if(i==0)return
extra+=Number(r.querySelector("input[type=number]").value||0)
})

return e+p+extra
}

/* UPDATE */
function update(){
let month=monthFilter.value
let total=0,ed=0,pr=0

document.querySelectorAll("#expenseTable tr").forEach((r,i)=>{
if(i==0)return

let i2=r.querySelectorAll("input")
let p=r.querySelector("select").value
let d=i2[0].value
let v=Number(i2[3].value)

if(!d)return
if(month && !d.startsWith(month))return

total+=v
if(p=="Edson")ed+=v
if(p=="Priscila")pr+=v
})

let income=getIncome()
let balance=income-total

incomeTotal.innerText="Renda: "+income.toFixed(2)
expenseTotal.innerText="Gastos: "+total.toFixed(2)
balance.innerText="Saldo: "+balance.toFixed(2)

edsonTotal.innerText=ed.toFixed(2)
priscilaTotal.innerText=pr.toFixed(2)

alert.innerText=
total>income*0.7
?"⚠ Alto gasto"
:balance>2000
?"✔ Excelente"
:"ℹ Normal"

save()
}

/* SAVE */
function save(){
let data={
salEdson:salEdson.value,
salPriscila:salPriscila.value,
expenses:[],
income:[]
}

document.querySelectorAll("#expenseTable tr").forEach((r,i)=>{
if(i==0)return
let i2=r.querySelectorAll("input")
data.expenses.push({
date:i2[0].value,
person:r.querySelector("select").value,
cat:i2[1].value,
desc:i2[2].value,
val:i2[3].value
})
})

document.querySelectorAll("#incomeTable tr").forEach((r,i)=>{
if(i==0)return
let i2=r.querySelectorAll("input")
data.income.push({
date:i2[0].value,
person:r.querySelector("select").value,
desc:i2[1].value,
val:i2[2].value
})
})

localStorage.setItem("financeSystem",JSON.stringify(data))
}

/* LOAD COMPATÍVEL */
function load(){
let d=JSON.parse(localStorage.getItem("financeSystem")||"null")
if(!d)return

salEdson.value=d.salEdson||0
salPriscila.value=d.salPriscila||0

if(d.expenses)d.expenses.forEach(addExpense)
if(d.income)d.income.forEach(addIncome)
}

/* EVENTS */
document.addEventListener("input",update)
monthFilter.addEventListener("change",update)

load()

if(!document.querySelector("#expenseTable tr:nth-child(2)"))addExpense()
if(!document.querySelector("#incomeTable tr:nth-child(2)"))addIncome()

update()

</script>

</body>
</html>
